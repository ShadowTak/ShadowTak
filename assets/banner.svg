<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6f0"/>
      <stop offset="0.5" stop-color="#e3d4ff"/>
      <stop offset="1" stop-color="#c9f0ff"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="260" rx="28" fill="url(#sky)"/>
  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M120 60 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M760 50 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M840 190 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <circle cx="200" cy="200" r="4"/><circle cx="700" cy="210" r="5"/><circle cx="60" cy="130" r="3"/>
  </g>
  <!-- kawaii character -->
  <g transform="translate(450 150)">
    <!-- ears -->
    <ellipse cx="-70" cy="-95" rx="18" ry="38" fill="#ffffff" stroke="#c9a6ff" stroke-width="4" transform="rotate(-18 -70 -95)"/>
    <ellipse cx="70" cy="-95" rx="18" ry="38" fill="#ffffff" stroke="#c9a6ff" stroke-width="4" transform="rotate(18 70 -95)"/>
    <ellipse cx="-70" cy="-92" rx="8" ry="22" fill="#ffb3d9" transform="rotate(-18 -70 -92)"/>
    <ellipse cx="70" cy="-92" rx="8" ry="22" fill="#ffb3d9" transform="rotate(18 70 -92)"/>
    <!-- face -->
    <circle r="92" fill="#ffffff" stroke="#c9a6ff" stroke-width="5"/>
    <!-- eyes -->
    <ellipse cx="-34" cy="-6" rx="11" ry="15" fill="#3d2c5e"/>
    <ellipse cx="34" cy="-6" rx="11" ry="15" fill="#3d2c5e"/>
    <circle cx="-30" cy="-12" r="4.5" fill="#ffffff"/>
    <circle cx="38" cy="-12" r="4.5" fill="#ffffff"/>
    <circle cx="-38" cy="0" r="2" fill="#ffffff"/>
    <circle cx="30" cy="0" r="2" fill="#ffffff"/>
    <!-- blush -->
    <ellipse cx="-56" cy="18" rx="16" ry="10" fill="url(#blush)"/>
    <ellipse cx="56" cy="18" rx="16" ry="10" fill="url(#blush)"/>
    <!-- mouth -->
    <path d="M-10 26 Q0 38 10 26" fill="none" stroke="#3d2c5e" stroke-width="4" stroke-linecap="round"/>
    <!-- little heart -->
    <path d="M0 -58 c-6 -10 -20 -4 -14 8 l14 14 l14 -14 c6 -12 -8 -18 -14 -8z" fill="#ff7eb6" transform="translate(0 -6) scale(0.8)"/>
  </g>
  <!-- title -->
  <text x="450" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#6b4fa0">✿ ShadowTak ✿</text>
</svg>
